name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - feature-*
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out code
      - name: Checkout code
        uses: actions/checkout@v2
      # Step 2: Setup JDK 17 for building the java code
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: 17        # Specify the version of Java
          distribution: temurin   # Specify the distribution (e.g., temurin, zulu, adopt)
          cache: gradle           # Optional: Cache dependencies for Gradle/Maven
      # Step 3: Provide gradle permission to run
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      # Step 4: Create artifact
      - name: Build with Gradle
        run: ./gradlew build
#        run: |
#          mkdir -p artifacts
#          for service in service-a service-b service-c; do
#          echo "Building $service"
#          ./gradlew :$service:build
#          cp $service/build/libs/*.jar artifacts/$service.jar
#          done

      # Step 5: Upload Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: customer-service-artifact
          path: customer-service/build/libs/customer-service-*.jar
#          path: artifact/

  test:
    runs-on: ubuntu-latest
    needs: build  #depends on build job completion status
    steps:
      # Step 1: Check out code
      - name: Checkout code
        uses: actions/checkout@v2
      # Step 2: Setup JDK 17 for java code
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: 17        # Specify the version of Java
          distribution: temurin   # Specify the distribution (e.g., temurin, zulu, adopt)
          cache: gradle           # Optional: Cache dependencies for Gradle/Maven
      # Step 3: Provide gradle permission to run
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      #Step 4: Run test
      - name: Run tests
        run: ./gradlew test

  create_image:
    runs-on: ubuntu-latest
    needs: test   #depends on test job completion status
    steps:
      # Step 1: Check out code
      - name: Checkout code
        uses: actions/checkout@v2
      # Step 2: Set up Docker CLI (when using custom runner not needed with gitlab default runners)
#      - name: Set up Docker
#        uses: docker/setup-buildx-action@v2

      # Step 2: Login to docker
      # manual docker login (compatible with Docker registries beyond Docker Hub)
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      # docker login using GitHub action (only compatible with github)
#      - name: Log in to Docker Hub
#        uses: docker/login-action@v2
#        with:
#          username: ${{ secrets.DOCKER_USERNAME }}
#          password: ${{ secrets.DOCKER_PASSWORD }}
      # Step 3: build and push docker image
      - name: Build and Push Docker image
        run: |
          pwd
          echo .
          docker build -t keshavkumar97/your-image-name:latest .\customer-service\Dockerfile
          docker push keshavkumar97/your-image-name:latest
