name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - feature-*
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out code
      - name: Checkout code
        uses: actions/checkout@v2
      # Step 2: Setup JDK 17 for building the java code
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: 17        # Specify the version of Java
          distribution: temurin   # Specify the distribution (e.g., temurin, zulu, adopt)
          cache: gradle           # Optional: Cache dependencies for Gradle/Maven
      # Step 3: Provide gradle permission to run
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      # Step 4: Create artifact
      - name: Build with Gradle
        run: ./gradlew build
      # Step 5: Upload Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: customer-service-artifact
          path: customer-service/build/libs/customer-service-*.jar

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: 17        # Specify the version of Java
          distribution: temurin   # Specify the distribution (e.g., temurin, zulu, adopt)
          cache: gradle           # Optional: Cache dependencies for Gradle/Maven

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

