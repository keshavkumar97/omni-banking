server:
  port: 8082
  error:
    whitelabel:       #disabled spring's default whitelable page and configured
      enabled: false  #/error endpoint as a fallback for any unexpected error

spring:
  application:
    name: auth-service

  banner:
    location: banner.txt

  datasource:
    url: jdbc:postgresql://localhost:5432/omni-bank-dev
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false  # Better to use logging instead
#    properties:
#      hibernate:
#        format_sql: true
#        generate_statistics: true
#logging:
#  level:
#    sql: debug
#    org.hibernate.SQL: DEBUG
#    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
#    org.hibernate.stat: DEBUG

app:
  cors:
    allow-origin:
      app-url: "http://localhost:3000"

auth:
  jwt:
    secret-key: "thisismyveryveryveryveryveryveryveryveryveryveryveryveryverylongsecretkeyforhs512!"

#✅ ddl-auto: create
#  Recreates the schema each time. For dev/testing only.
#
#✅ show-sql: true
#  Logs raw SQL queries to console (without values).
#
#✅ hibernate.format_sql: true
#  Formats SQL nicely in logs.
#
#✅ hibernate.generate_statistics: true
#  Enables Hibernate to collect performance statistics (used with metrics/logging).
#
#✅ logging.level.org.hibernate.SQL: DEBUG
#  Logs SQL statements (same as show-sql, but more consistent with SLF4J).
#
#✅ logging.level.org.hibernate.type.descriptor.sql.BasicBinder: TRACE
#  Logs actual bind parameter values for prepared statements.
#
#✅ logging.level.org.hibernate.stat: DEBUG
#  Logs Hibernate stats, such as entity load counts, cache hits, etc.
