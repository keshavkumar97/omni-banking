configurations {
    // Spring Cloud Gateway is reactive (WebFlux/Netty).
    // The root build.gradle injects spring-boot-starter into every subproject,
    // which drags in spring-boot-starter-web (Tomcat/MVC) — that conflicts with WebFlux.
    // We exclude the Servlet stack entirely here.
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
        exclude group: 'org.springframework',      module: 'spring-webmvc'
    }
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'

    // Reactive web (Netty) — required explicitly after excluding spring-boot-starter-web
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // JWT validation — same version as auth-service
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // Health/readiness probes
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}

// Spring Cloud 2022.0.x is the release train for Spring Boot 3.1.x
ext {
    set('springCloudVersion', '2022.0.5')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

bootJar {
    mainClass = 'org.omni.bank.Main'
}


